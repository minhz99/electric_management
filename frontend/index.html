<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý điện năng</title>
  <meta name="description" content="Theo dõi điện năng thời gian thực qua Firebase RTDB" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3347;
      --text: #e8eaf0;
      --muted: #7b82a0;
      --accent: #4f8ef7;
      --accent2: #7c6fff;
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      --radius: 14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(26,29,39,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center; font-size: 18px; flex-shrink: 0;
    }
    .logo h1 { font-size: 16px; font-weight: 700; }
    .logo p  { font-size: 11px; color: var(--muted); margin-top: 1px; }

    #status-badge {
      font-size: 12px; font-weight: 500;
      padding: 5px 12px; border-radius: 20px;
      background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    #status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background .4s; }
    #status-dot.ok   { background: var(--ok);    box-shadow: 0 0 8px var(--ok); }
    #status-dot.warn { background: var(--warn);  animation: pulse 1.2s infinite; }
    #status-dot.err  { background: var(--danger); }

    @keyframes pulse { 0%,100%{ opacity:1 } 50%{ opacity:.4 } }

    /* ── Main layout ── */
    main { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 20px; }

    /* ── Stats grid ── */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media(min-width:600px){ .stats{ grid-template-columns: repeat(3, 1fr); } }
    @media(min-width:900px){ .stats{ grid-template-columns: repeat(5, 1fr); } }

    .stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      transition: transform .25s, border-color .25s;
    }
    .stat:hover { transform: translateY(-2px); border-color: var(--accent); }
    .stat.accent { background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%); border-color: var(--accent); }
    .stat label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; margin-bottom: 8px; }
    .stat.accent label { color: rgba(255,255,255,.65); }
    .stat .val { font-size: 24px; font-weight: 700; line-height: 1; }
    .stat .unit { font-size: 11px; color: var(--muted); margin-left: 4px; }
    .stat.accent .unit { color: rgba(255,255,255,.6); }

    /* ── Cards / Panels ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
    }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .card .sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; }

    canvas { display: block; width: 100% !important; }

    /* ── Last updated ── */
    #last-updated { font-size: 11px; color: var(--muted); text-align: right; }
    #last-updated span { color: var(--text); }

    /* ── Empty state ── */
    .empty { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div>
        <h1>Điện năng</h1>
        <p>Theo dõi realtime · Firebase RTDB</p>
      </div>
    </div>
    <div id="status-badge">
      <span id="status-dot"></span>
      <span id="status-text">Đang kết nối…</span>
    </div>
  </header>

  <main>
    <p id="last-updated" hidden>Cập nhật: <span id="update-time">—</span></p>

    <!-- Stats -->
    <section class="stats">
      <div class="stat"><label>Điện áp</label><span class="val" id="s-voltage">—</span><span class="unit">V</span></div>
      <div class="stat"><label>Dòng điện</label><span class="val" id="s-current">—</span><span class="unit">A</span></div>
      <div class="stat"><label>Công suất</label><span class="val" id="s-power">—</span><span class="unit">kW</span></div>
      <div class="stat"><label>Tần số</label><span class="val" id="s-freq">—</span><span class="unit">Hz</span></div>
      <div class="stat"><label>Cos φ</label><span class="val" id="s-pf">—</span></div>
      <div class="stat"><label>Hôm nay</label><span class="val" id="s-daily-kwh">—</span><span class="unit">kWh</span></div>
      <div class="stat"><label>Tháng này</label><span class="val" id="s-monthly-kwh">—</span><span class="unit">kWh</span></div>
      <div class="stat"><label>Tiền hôm nay</label><span class="val" id="s-daily-cost">—</span><span class="unit">đ</span></div>
      <div class="stat accent"><label>Tiền tháng (tạm tính)</label><span class="val" id="s-monthly-cost">—</span><span class="unit">đ</span></div>
    </section>

    <!-- Realtime chart -->
    <div class="card">
      <h2>Công suất thời gian thực</h2>
      <p class="sub" id="rt-sub">Cập nhật mỗi lần nhận dữ liệu MQTT · đơn vị W</p>
      <canvas id="chart-realtime" height="200"></canvas>
    </div>

    <!-- Hourly history chart -->
    <div class="card">
      <h2>Công suất theo giờ</h2>
      <p class="sub" id="hist-sub">Đơn vị kW · múi giờ Việt Nam</p>
      <canvas id="chart-history" height="200"></canvas>
    </div>

    <!-- 7-day bar chart -->
    <div class="card">
      <h2>Điện năng 7 ngày gần nhất</h2>
      <p class="sub">kWh theo ngày (MM-DD)</p>
      <canvas id="chart-daily" height="160"></canvas>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
